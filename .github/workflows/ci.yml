name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU-only PyTorch)
        run: uv sync
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest
      - name: Static security analysis
        run: uv run bandit -q -r src
      - name: Known vulnerabilities (PyTorch excluded: its CPU build is not on PyPI)
        run: |
          uv export --no-hashes --no-emit-project --no-emit-package torch --no-emit-package torchvision -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
      - name: JavaScript matches the Python reference
        if: hashFiles('artifacts/reference.json') != ''
        run: node web_test/forward.test.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
